# n8n studio: a private n8n plus a Playwright capture service; managed by ai-bridge (`docker compose up`).
name: ai-bridge-studio

services:
  n8n:
    image: n8nio/n8n:2.41.4
    restart: unless-stopped
    environment:
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_RUNNERS_ENABLED: "true"
      GENERIC_TIMEZONE: Europe/Moscow
    volumes:
      - n8n-data:/home/node/.n8n
    ports:
      - "127.0.0.1:7779:5678"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5678/healthz/readiness"]
      interval: 5s
      timeout: 5s
      retries: 60

  capture:
    build: ./capture
    restart: unless-stopped
    init: true
    environment:
      N8N_URL: http://n8n:5678
      STUDIO_EMAIL: studio@ai-bridge.local
      STUDIO_PASSWORD: AiBridge-Studio-1
    ports:
      - "127.0.0.1:7778:7778"
    depends_on:
      n8n:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7778/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  n8n-data:
