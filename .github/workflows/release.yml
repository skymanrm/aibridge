name: Release

# Builds the apps and CLI for a published GitHub release and attaches them to it.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild, e.g. v0.5.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  VERSION_VAR: github.com/skymanrm/aibridge/bridge.Version
  WAILS_VERSION: v2.16.0
  GH_TOKEN: ${{ github.token }}

jobs:
  app:
    name: app (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@$WAILS_VERSION
      - name: Set version
        run: |
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          jq --arg v "${TAG#v}" '.info.productVersion = $v' wails.json > wails.json.tmp && mv wails.json.tmp wails.json

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          wails build -platform darwin/universal -ldflags "-X $VERSION_VAR=$VERSION"
          codesign --force --deep --sign - "build/bin/AI Bridge.app"
          ditto -c -k --keepParent "build/bin/AI Bridge.app" "AI-Bridge-$VERSION-macos-universal.zip"
          gh release upload "$TAG" "AI-Bridge-$VERSION-macos-universal.zip" --clobber

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          echo "C:\\Program Files (x86)\\NSIS" >> "$GITHUB_PATH"
      - name: Build Windows app
        if: runner.os == 'Windows'
        run: |
          wails build -platform windows/amd64 -nsis -ldflags "-X $VERSION_VAR=$VERSION"
          cd build/bin
          mv "AI Bridge-amd64-installer.exe" "AI-Bridge-$VERSION-windows-amd64-setup.exe"
          7z a -bd "AI-Bridge-$VERSION-windows-amd64-portable.zip" "AI Bridge.exe"
          gh release upload "$TAG" "AI-Bridge-$VERSION-windows-amd64-setup.exe" \
            "AI-Bridge-$VERSION-windows-amd64-portable.zip" --clobber

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build CLI
        run: |
          VERSION=${TAG#v}
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*} arch=${target#*/} ext=
            [ "$os" = windows ] && ext=.exe
            name=ai-bridge-$VERSION-$os-$arch
            mkdir -p "dist/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X $VERSION_VAR=$VERSION" -o "dist/$name/ai-bridge$ext" ./cmd/ai-bridge
            cp README.md LICENSE "dist/$name/"
            if [ "$os" = windows ]; then (cd dist && zip -qr "$name.zip" "$name"); else tar -C dist -czf "dist/$name.tar.gz" "$name"; fi
          done
          gh release upload "$TAG" dist/*.tar.gz dist/*.zip --clobber

  checksums:
    needs: [app, cli]
    runs-on: ubuntu-latest
    steps:
      - name: Upload SHA256SUMS
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D assets --skip-existing
          rm -f assets/SHA256SUMS
          (cd assets && sha256sum * > SHA256SUMS)
          gh release upload "$TAG" assets/SHA256SUMS -R "$GITHUB_REPOSITORY" --clobber
